<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sendmi</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue: #1a6ff4;
      --blue-dark: #1258d0;
      --text: #1a1a2e;
      --muted: #5a5a72;
      --bg: #f0f2f8;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* NAV */
    nav {
      background: #fff;
      border-bottom: 1px solid #e4e6ef;
      padding: 0 24px;
      height: 56px;
      display: flex;
      align-items: center;
    }

    .logo {
      font-size: 22px;
      font-weight: 700;
      color: var(--blue);
      letter-spacing: -0.5px;
      text-decoration: none;
    }

    .logo span {
      font-style: italic;
    }

    /* HERO */
    .hero {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 60px 32px;
      animation: fadeUp 0.7s ease both;
    }

    .hero-inner {
      max-width: 400px;
    }

    .hero h1 {
      font-size: 32px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.2;
      letter-spacing: -0.5px;
      margin-bottom: 16px;
    }

    .hero h1 .accent {
      color: var(--blue);
      font-style: italic;
    }

    .hero p {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 32px;
      letter-spacing: 0.01em;
    }

    .btn-primary {
      display: inline-block;
      background: var(--blue);
      color: #fff;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      font-weight: 600;
      padding: 14px 36px;
      border-radius: 50px;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
      box-shadow: 0 4px 18px rgba(26,111,244,0.25);
    }

    .btn-primary:hover {
      background: var(--blue-dark);
      transform: translateY(-1px);
    }

    .login-link {
      display: block;
      margin-top: 20px;
      font-size: 14px;
      color: var(--blue);
      text-decoration: none;
      font-weight: 500;
      transition: opacity 0.2s;
    }

    .login-link:hover {
      opacity: 0.75;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(28px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <nav>
    <a class="logo" href="#"><span>S</span>endi</a>
  </nav>

  <main class="hero">
    <div class="hero-inner">
      <h1>Grow your audience <span class="accent">fast</span></h1>
      <p>capture leads. Send broadcasts. make money.</p>
      <a class="btn-primary" href="login.html">Get Started Free</a>
      <a class="login-link" href="login.html">Already have an account? Login</a>
    </div>
  </main>

</body>
</html>
